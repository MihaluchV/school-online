<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Python: списки — тренажер</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* VOICE everyday learning, friendly for 14-year-olds, calm enough for Zoom demo
   IDEA a row of list cells with indices — every task works on that row
   PICTURE the working task itself, under a Python-blue band with an indexed list strip
   COLOUR Python blue #306998 band, Python yellow #ffd43b accent, green/coral for right/wrong
   TYPE Rubik 700 + Rubik, JetBrains Mono for code
   LAYOUT band with title + nav of 8 stops; task fills width; phone: stacked, nav scrolls */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0e1620);--ink:light-dark(#13202e,#e6edf5);--mut:light-dark(#566577,#9fb0c2);--pan:light-dark(#f2f6fa,#16222f);--line:light-dark(#d5dee8,#2a3a4c);--blue:#306998;--band:light-dark(#306998,#1a3b5c);--yel:#ffd43b;--ok:light-dark(#1b8a4c,#4cc77f);--okb:light-dark(#e3f6ea,#123323);--bad:light-dark(#c4402b,#ff8a73);--badb:light-dark(#fdeae5,#3a1c17);--code:#14202c;--codeink:#e8eef5}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 Rubik,system-ui,sans-serif;overflow-x:clip}
code,pre,.mono{font-family:"JetBrains Mono",ui-monospace,Consolas,monospace}
*,*::before,*::after{font-variant-ligatures:none!important;font-feature-settings:"liga" 0,"calt" 0,"dlig" 0!important}
button{font:inherit;color:inherit;cursor:pointer}
header{background:var(--band);color:#fff;padding:20px max(2.5vw,16px) 0}
.top{display:flex;gap:24px;align-items:center;justify-content:space-between;max-width:1400px;margin:0 auto}
h1{font-size:clamp(26px,4vw,40px);line-height:1.05;letter-spacing:-.02em;margin:0 0 6px;text-wrap:balance}
.sub{margin:0;color:#d9e6f2}
.dia{flex:none;width:210px;height:96px}
@media(max-width:640px){.dia{display:none}}
nav{display:flex;flex-wrap:wrap;gap:4px;max-width:1400px;margin:18px auto 0}
nav button{flex:1 1 auto;justify-content:center;display:flex;align-items:center;gap:8px;border:0;background:rgba(255,255,255,.12);color:#fff;padding:10px 11px;white-space:nowrap;font-size:15px;border-radius:10px 10px 0 0;min-height:44px}
nav button b{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.2);font-size:13px}
nav button.on{background:var(--bg);color:var(--ink)}
nav button.on b{background:var(--yel);color:#13202e}
nav button.done b{background:#4cc77f;color:#0b2216}
nav button.try b{background:#ffb347;color:#2b1700}
nav button:focus-visible{outline:3px solid var(--yel);outline-offset:-3px}
main{max-width:1400px;margin:0 auto;padding:26px max(2.5vw,16px) 40px}
.task{display:none}.task.on{display:block}
.meta{color:var(--mut);margin:0 0 4px;font-size:15px}
h2{font-size:clamp(24px,3vw,32px);line-height:1.1;letter-spacing:-.02em;margin:0 0 8px}
.ins{margin:0 0 18px;max-width:72ch}
.panel{background:var(--pan);border:1px solid var(--line);border-radius:14px;padding:16px}
.bar{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 0;align-items:center}
.btn{min-height:44px;padding:10px 18px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:500}
.btn.pri{background:var(--yel);border-color:#e6bd1f;color:#13202e}
.btn.run{background:var(--blue);border-color:var(--blue);color:#fff}
.btn:hover{filter:brightness(.96)}.btn:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.btn[hidden]{display:none}
.hint{margin-top:14px;border-left:4px solid var(--yel);background:var(--pan);padding:10px 14px;border-radius:0 10px 10px 0}
.hint p{margin:4px 0}
.fb{margin-top:14px;padding:12px 16px;border-radius:12px;border:1px solid}
.fb.ok{background:var(--okb);border-color:var(--ok)}.fb.bad{background:var(--badb);border-color:var(--bad)}
.fb h3{margin:0 0 4px;font-size:18px}.fb ul{margin:6px 0 0;padding-left:20px}.fb li{margin:3px 0}
.navb{display:flex;justify-content:space-between;gap:10px;margin-top:28px;border-top:1px solid var(--line);padding-top:16px}
code.i{background:var(--pan);border:1px solid var(--line);border-radius:5px;padding:0 5px;font-size:.92em}
pre.cd{background:var(--code);color:var(--codeink);border-radius:10px;padding:12px 14px;margin:8px 0;overflow-x:auto;font-size:15px;line-height:1.5}
.k{color:#ffd43b;font-weight:700}.f{color:#7cc4ff}.s{color:#a8e6a1}.n{color:#ffb38a}.c{color:#8394a8;font-style:italic}
/* task 1 */
.qs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:14px}
.q{background:var(--pan);border:2px solid var(--line);border-radius:14px;padding:14px 16px}
.q.ok{border-color:var(--ok)}.q.bad{border-color:var(--bad)}
.q p.t{margin:0 0 8px;font-weight:500}
.opt{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:var(--bg);margin:6px 0;cursor:pointer;min-height:44px}
.opt input{width:20px;height:20px;accent-color:var(--blue);flex:none}
.opt.sel{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.opt.right{border-color:var(--ok);background:var(--okb)}
.cm{margin:8px 0 0;font-size:15px;padding:8px 10px;border-radius:8px;background:var(--bg)}
.q.ok .cm{color:var(--ok)}.q.bad .cm{color:var(--bad)}
/* task 2 */
.match{position:relative;display:grid;grid-template-columns:minmax(0,.7fr) minmax(40px,.5fr) minmax(0,1.3fr);gap:0}
.match svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.col{display:flex;flex-direction:column;gap:10px}
.it{min-height:48px;border:2px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 12px;text-align:left;position:relative}
.col.l .it{font:700 20px "JetBrains Mono",monospace;text-align:center}
.it.pick{border-color:var(--yel);box-shadow:0 0 0 3px rgba(255,212,59,.45)}
.it.lnk{border-color:var(--blue)}
.it.ok{border-color:var(--ok)}.it.bad{border-color:var(--bad)}
/* dnd shared */
.chip{display:inline-flex;align-items:center;justify-content:center;min-height:42px;min-width:54px;padding:6px 12px;border-radius:9px;border:2px solid var(--blue);background:var(--bg);font:700 17px "JetBrains Mono",monospace;cursor:grab;touch-action:none;user-select:none}
.chip.T{border-color:var(--ok);color:var(--ok)}.chip.F{border-color:var(--bad);color:var(--bad)}
.chip.sel,.card.sel,.pl.sel{outline:3px solid var(--yel);outline-offset:2px}
.ghost{position:fixed;z-index:50;pointer-events:none;opacity:.92;box-shadow:0 8px 20px rgba(0,0,0,.25);margin:0}
.lift{opacity:.35}
.over{outline:3px dashed var(--blue);outline-offset:2px}
.pal{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line);margin-bottom:14px}
.pal span{color:var(--mut);font-size:15px}
/* task 3 */
.ex{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:12px}
.exi{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--pan);border:2px solid var(--line);border-radius:12px;padding:10px 12px}
.exi code{font-size:17px;font-weight:700}
.exi.ok{border-color:var(--ok)}.exi.bad{border-color:var(--bad)}
.slot{display:inline-flex;align-items:center;justify-content:center;min-width:86px;min-height:44px;border:2px dashed var(--mut);border-radius:9px;font:700 16px "JetBrains Mono",monospace;color:var(--mut);background:var(--bg);cursor:pointer;vertical-align:middle}
.slot.fill{border-style:solid;border-color:var(--blue);color:var(--ink)}
.slot.T{border-color:var(--ok);color:var(--ok)}.slot.F{border-color:var(--bad);color:var(--bad)}
.slot.ok{background:var(--okb);border-color:var(--ok)}.slot.bad{background:var(--badb);border-color:var(--bad)}
.ctx{margin:16px 0 8px;font-weight:500}
.ec{grid-column:1/-1;font-size:15px;color:var(--bad);margin:-4px 0 0}
/* task 4 */
.pool{display:flex;flex-wrap:wrap;gap:10px;min-height:70px;padding:12px;border:2px dashed var(--line);border-radius:14px;margin-bottom:16px}
.card{background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:9px 12px;max-width:340px;cursor:grab;touch-action:none;user-select:none;font-size:15px}
.card.ok{border-color:var(--ok);background:var(--okb)}.card.bad{border-color:var(--bad);background:var(--badb)}
.bks{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px}
.bk{background:var(--pan);border:2px solid var(--line);border-radius:14px;padding:12px;min-height:200px}
.bk h3{margin:0;font-size:18px}.bk pre{margin:6px 0 10px;font-size:13px;padding:8px 10px}
.bk .cards{display:flex;flex-direction:column;gap:8px}
.bk .card{max-width:none}
/* task 5 */
.pz{display:flex;flex-direction:column;gap:6px;background:var(--code);border-radius:12px;padding:12px;counter-reset:ln}
.pl{display:flex;align-items:center;gap:8px;background:#1e2d3d;color:var(--codeink);border:2px solid #2c3e52;border-radius:8px;padding:6px 8px;cursor:grab;touch-action:none;user-select:none;font:15px "JetBrains Mono",monospace;white-space:pre;overflow-x:auto}
.pl::before{counter-increment:ln;content:counter(ln);color:#6f8297;width:1.6em;text-align:right;flex:none}
.pl .tx{flex:1}
.pl.ok{border-color:#4cc77f}.pl.bad{border-color:#ff8a73}
.pl .mv{flex:none;display:flex;gap:4px}
.pl .mv button{width:34px;height:34px;border:1px solid #3a5068;background:#24384c;color:#fff;border-radius:6px}
.two{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:820px){.two{grid-template-columns:minmax(0,1fr)}}
/* task 6 */
.gap{background:var(--code);color:var(--codeink);border-radius:12px;padding:14px;font:16px/2.3 "JetBrains Mono",monospace;overflow-x:auto;white-space:pre}
.gap .slot{min-width:64px;min-height:38px;background:#1e2d3d;color:#cfe0f0;border-color:#6f8297}
.gap .slot.fill{border-color:var(--yel);color:var(--yel)}
.gap .slot.ok{background:#123323;border-color:#4cc77f;color:#a8e6a1}.gap .slot.bad{background:#3a1c17;border-color:#ff8a73;color:#ffb3a3}
/* editor + console */
.ed{display:grid;grid-template-columns:auto minmax(0,1fr);background:var(--code);border-radius:12px;overflow:hidden;border:2px solid #2c3e52}
.ed:focus-within{border-color:var(--yel)}
.gut{padding:12px 8px 12px 12px;color:#6f8297;text-align:right;font:15px/1.6 "JetBrains Mono",monospace;user-select:none;background:#101a24}
.gut span{display:block}
.ew{display:grid;overflow:hidden}
.ew>*{grid-area:1/1;margin:0;padding:12px 14px;font:15px/1.6 "JetBrains Mono",monospace;white-space:pre;tab-size:4;border:0;letter-spacing:0}
.ew pre{color:var(--codeink);pointer-events:none;overflow:hidden}
.ew textarea{background:transparent;color:transparent;caret-color:#ffd43b;resize:none;outline:none;overflow-x:auto;overflow-y:hidden;width:100%}
.ew textarea::selection{background:rgba(124,196,255,.35)}
.con{background:#0b1219;color:#dfe8f1;border-radius:12px;padding:12px 14px;font:15px/1.5 "JetBrains Mono",monospace;min-height:120px;white-space:pre-wrap;overflow-wrap:anywhere;margin-top:10px}
.con .er{color:#ff8a73}.con .in{color:#ffd43b}.con .sys{color:#7f93a8}
.con input{background:transparent;border:0;border-bottom:2px solid #ffd43b;color:#ffd43b;font:inherit;font-size:16px;width:12ch;outline:none}
.tests{margin-top:12px;display:grid;gap:8px}
.tr{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--pan);font-size:15px}
.tr b{font-size:18px;line-height:1.2}
.tr.ok b{color:var(--ok)}.tr.bad b{color:var(--bad)}
.subt{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.subt button{min-height:44px;padding:8px 16px;border-radius:10px;border:2px solid var(--line);background:var(--bg);font-weight:500}
.subt button.on{border-color:var(--blue);background:var(--pan)}
.subt button.done{border-color:var(--ok)}
.chk{list-style:none;padding:0;margin:8px 0 0}.chk li{padding:3px 0}
details.memo{margin-top:30px;background:var(--pan);border-radius:12px;padding:10px 16px;border:1px solid var(--line)}
details.memo summary{cursor:pointer;font-weight:500;min-height:32px}
.lbl{font-weight:500;margin:14px 0 6px}
@media(max-width:600px){main{padding-top:18px}.gap{font-size:14px;padding:10px}.gap .slot{min-width:46px}.pl{font-size:13px}.match{grid-template-columns:minmax(0,.55fr) 34px minmax(0,1.45fr)}.col.l .it{font-size:17px}.it{font-size:14px}}
@media(prefers-reduced-motion:no-preference){.task.on{animation:in .25s ease-out}@keyframes in{from{opacity:0;transform:translateY(6px)}}}
@media(max-width:760px){nav button:not(.on) .nm{display:none}nav button{padding:10px}}
@media(max-width:560px){nav button .nm,nav button.on .nm{display:none}nav button{flex:1 1 0;padding:10px 0}}
/* lists additions */
nav button{font-size:14px;padding:10px 8px}
@media(max-width:700px){#t5 .pal{position:static}}
#t2 .col.l .it{font-size:16px}
@media(max-width:600px){#t2 .col.l .it{font-size:13px;padding:8px 6px}}
.lst{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0 14px}
.lst .cell{display:flex;flex-direction:column;align-items:center;gap:4px}
.lst .v{display:grid;place-items:center;min-width:64px;height:54px;border-radius:10px;background:var(--code);color:#ffb38a;font:700 20px "JetBrains Mono",monospace;border:2px solid #2c3e52}
.lst .ix{font:700 14px "JetBrains Mono",monospace;color:var(--blue)}
.lst .nx{font:700 14px "JetBrains Mono",monospace;color:var(--mut)}
.lst .nm{font:700 20px "JetBrains Mono",monospace;align-self:center;margin-right:6px}
.ex .slot{min-width:110px;padding:0 8px;font-size:15px}
.exi code{font-size:18px}
.ex2{grid-template-columns:repeat(auto-fit,minmax(min(100%,430px),1fr))}.ex2 .exi code{font-size:15px}.ex2 .slot{font-size:13px;max-width:55%;text-align:center}
.codebox{position:sticky;top:76px}
@media(max-width:820px){.codebox{position:static}}
.cl{display:flex;flex-direction:column;gap:12px}
.cp{background:var(--pan);border:2px solid var(--line);border-radius:14px;padding:12px 14px}
.cp.ok{border-color:var(--ok)}.cp.bad{border-color:var(--bad)}
.cp h3{margin:0 0 8px;font-size:17px;font-weight:500}
.cages{display:flex;flex-wrap:wrap;gap:8px}
.cg{display:flex;flex-direction:column;align-items:center;gap:3px}
.cg .slot{position:relative;min-width:84px;min-height:56px;border-radius:8px 8px 4px 4px;border:2px solid var(--mut);border-style:solid;overflow:hidden;font-size:15px}
.cg .slot::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 14px,color-mix(in srgb,var(--mut) 45%,transparent) 14px 17px);pointer-events:none}
.cg .slot.fill{border-color:var(--blue);background:var(--bg)}
.cg span.i{font:700 13px "JetBrains Mono",monospace;color:var(--mut)}
.xrow{display:flex;align-items:center;gap:10px;margin-top:10px;font:700 18px "JetBrains Mono",monospace}
.chip.an{font-family:Rubik,sans-serif;font-weight:500;border-color:var(--blue)}
.inbox{margin-top:10px}
.inbox textarea{width:100%;min-height:64px;background:var(--pan);color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:8px 12px;font:16px/1.5 "JetBrains Mono",monospace;resize:vertical}
.inbox textarea:focus{outline:none;border-color:var(--blue)}
.inbox small{display:block;color:var(--mut);font-size:14px;margin-top:2px}
.pys{font-size:14px;color:var(--mut);margin:6px 0 0}
.memo table{border-collapse:collapse;width:100%;font-size:15px;margin:8px 0}
.memo td,.memo th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.memo th{font-weight:500;color:var(--mut)}
</style>

<script type="text/plain" id="pyc">
import sys, io, json, traceback
def __run(src, inputs, echo):
    buf = io.StringIO()
    q = list(inputs)
    def _inp(p=''):
        if not q:
            raise EOFError('no input')
        v = q.pop(0)
        if echo:
            buf.write(str(p) + v + '\n')
        return v
    g = {'__name__': '__main__', 'input': _inp}
    old = sys.stdout
    sys.stdout = buf
    err = None
    try:
        exec(compile(src, '<code>', 'exec'), g)
    except SyntaxError as e:
        err = [type(e).__name__, str(e.msg), e.lineno]
    except BaseException as e:
        ln = None
        for fr in traceback.extract_tb(e.__traceback__):
            if fr.filename == '<code>':
                ln = fr.lineno
        err = [type(e).__name__, str(e), ln]
    finally:
        sys.stdout = old
    return json.dumps({'out': buf.getvalue(), 'err': err})
</script>

const BIN=new Set(['print','input','int','float','str','len','min','max','sum','sorted','range','list','round','abs']);
function hl(src){
  const re=/(#.*)|(f?(?:"[^"\n]*"?|'[^'\n]*'?))|([\p{L}_][\p{L}\p{N}_]*)|(\d+(?:\.\d+)?)|([\s\S])/gu;
  let o='',m,prev='';
  while((m=re.exec(src))){
    if(m[1])o+=`<span class="c">${esc(m[1])}</span>`;
    else if(m[2])o+=`<span class="s">${esc(m[2])}</span>`;
    else if(m[3])o+=KW.has(m[3])?`<span class="k">${m[3]}</span>`:(BIN.has(m[3])||prev==='.')?`<span class="f">${m[3]}</span>`:esc(m[3]);
    else if(m[4])o+=`<span class="n">${m[4]}</span>`;
    else o+=esc(m[5]);
    prev=m[5]||'';
  }
  return o;
}

/* ---------- real Python (Pyodide) ---------- */
const PYV='https://cdn.jsdelivr.net/pyodide/v0.26.4/full/';
const PYC=$('#pyc').textContent;
const PY={st:'idle',w:null,main:null,n:0,cb:new Map(),readyP:null,listeners:new Set(),
  set(s){this.st=s;this.listeners.forEach(f=>f(s))},
  start(){
    if(this.readyP)return this.readyP;
    this.set('loading');
    this.readyP=new Promise((res,rej)=>{
      try{
        const src=`importScripts('${PYV}pyodide.js');let py;
onmessage=async e=>{const d=e.data;
 if(d.init){try{py=await loadPyodide({indexURL:'${PYV}'});py.runPython(d.init);postMessage({ready:1})}catch(err){postMessage({fail:String(err)})}return}
 const run=py.globals.get('__run');const out=[];
 for(const inp of d.inputs){out.push(JSON.parse(run(d.code,py.toPy(inp),d.echo)))}
 run.destroy();postMessage({id:d.id,out})};`;
        const w=new Worker(URL.createObjectURL(new Blob([src],{type:'text/javascript'})));
        w.onmessage=e=>{const d=e.data;
          if(d.ready){this.w=w;this.set('ready');res()}
          else if(d.fail){w.terminate();this.mainThread().then(res,rej)}
          else if(this.cb.has(d.id)){this.cb.get(d.id)(d.out);this.cb.delete(d.id)}};
        w.onerror=e=>{e.preventDefault();if(this.st==='loading'){w.terminate();this.mainThread().then(res,rej)}};
        w.postMessage({init:PYC});
      }catch(err){this.mainThread().then(res,rej)}
    }).catch(e=>{this.set('fail');this.readyP=null;throw e});
    return this.readyP;
  },
  mainThread(){return new Promise((res,rej)=>{
    const go=async()=>{try{this.main=await loadPyodide({indexURL:PYV});this.main.runPython(PYC);this.set('ready');res()}catch(e){rej(e)}};
    if(window.loadPyodide)return go();
    const s=document.createElement('script');s.src=PYV+'pyodide.js';s.onload=go;s.onerror=()=>rej(new Error('net'));document.head.append(s)})},
  async run(code,inputs,echo){
    await this.start();
    if(this.main){const f=this.main.globals.get('__run');const out=inputs.map(inp=>JSON.parse(f(code,this.main.toPy(inp),echo)));f.destroy();return out}
    const id=++this.n;
    return new Promise(res=>{
      const t=setTimeout(()=>{this.cb.delete(id);this.w.terminate();this.w=null;this.readyP=null;this.set('idle');
        res(inputs.map(()=>({out:'',err:['Timeout','',null]})))},6000);
      this.cb.set(id,out=>{clearTimeout(t);res(out)});
      this.w.postMessage({id,code,inputs,echo});
    });
  }
};

function errText(e){const[t,m,l]=e;
  if(t==='Timeout')return'Програма працює занадто довго й зупинена — можливо, цикл ніколи не закінчується.';
  let ua='';for(const[r,f]of UA){const x=m.match(r);if(x){ua=f(x);break}}
  return`${l?`Рядок ${l}: `:''}${t} — ${ua||esc(m)}${ua?`\n(англійською: ${m})`:''}`;
}
function pyStatus(el){const f=s=>{el.textContent=s==='loading'?'⏳ Завантажую Python у браузері… Перший раз це займає 5–20 секунд.':s==='fail'?'Не вдалося завантажити Python. Перевір інтернет і натисни «Запустити» ще раз.':''};PY.listeners.add(f);f(PY.st)}

function makeConsole(el){
  el.innerHTML='<span class="sys">Тут з\'явиться результат. Натисни «Запустити».</span>';
  return async function run(code,lines){
    el.innerHTML='<span class="sys">Виконую…</span>';
    try{const[r]=await PY.run(code,[lines],true);el.innerHTML='';
      const s=document.createElement('span');s.textContent=r.out;el.append(s);
      if(r.err){const e=document.createElement('span');e.className='er';e.textContent=(r.out?'\n':'')+errText(r.err);el.append(e)}
      else el.insertAdjacentHTML('beforeend','<span class="sys">\n— програму завершено —</span>');
    }catch(e){el.innerHTML='<span class="er">Python не завантажився. Перевір підключення до інтернету й спробуй ще раз.</span>'}
  };
}
const norm=s=>s.toLowerCase().replace(/[’ʼ`]/g,"'").replace(/[«»"]/g,'').replace(/[!.,…:;]+/g,' ').replace(/\s+/g,' ').trim();
async function runTests(code,tests){
  const rs=await PY.run(code,tests.map(t=>t.inp),false);
  return rs.map((r,k)=>{const lines=r.out.split('\n').map(s=>s.trim()).filter(Boolean);
    return{t:tests[k],lines,err:r.err,ok:!r.err&&norm(lines.join('\n'))===norm(tests[k].out.join('\n'))}});
}

function makeEditor(host,code){
  host.innerHTML='<div class="ed"><div class="gut"></div><div class="ew"><pre aria-hidden="true"></pre><textarea spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" wrap="off" aria-label="Редактор коду"></textarea></div></div>';
  const ta=$('textarea',host),pre=$('pre',host),gut=$('.gut',host);
  const upd=()=>{const n=ta.value.split('\n').length;pre.innerHTML=hl(ta.value)+'\n';gut.innerHTML=Array.from({length:Math.max(n,6)},(_,i)=>`<span>${i+1}</span>`).join('');ta.rows=Math.max(n,6)};
  const ins=t=>{if(!document.execCommand('insertText',false,t)){ta.setRangeText(t,ta.selectionStart,ta.selectionEnd,'end');upd()}};
  ta.addEventListener('input',upd);ta.addEventListener('scroll',()=>{pre.scrollLeft=ta.scrollLeft});
  ta.addEventListener('keydown',e=>{
    if(e.key==='Tab'&&!e.shiftKey){e.preventDefault();ins('    ')}
    else if(e.key==='Tab'&&e.shiftKey){e.preventDefault();const s=ta.value.lastIndexOf('\n',ta.selectionStart-1)+1;const sp=ta.value.slice(s).match(/^ {1,4}/);if(sp){ta.setRangeText('',s,s+sp[0].length,'end');upd()}}
    else if(e.key==='Enter'){e.preventDefault();const s=ta.value.lastIndexOf('\n',ta.selectionStart-1)+1;const line=ta.value.slice(s,ta.selectionStart);let ind=line.match(/^ */)[0];if(/:\s*$/.test(line))ind+='    ';ins('\n'+ind)}
  });
  ta.value=code;upd();
  return{get:()=>ta.value,set:v=>{ta.value=v;upd()}};
}

/* ---------- drag & drop (mouse, touch, or tap-tap) ---------- */
function dnd(root,onDrop,onTap){
  let st=null,sel=null,skip=false;
  const zoneAt=(x,y)=>{const z=document.elementFromPoint(x,y)?.closest('[data-drop]');return z&&root.contains(z)?z:null};
  root.addEventListener('pointerdown',e=>{const d=e.target.closest('[data-drag]');if(!d||e.button>0||e.target.closest('button:not([data-drag])'))return;st={d,x:e.clientX,y:e.clientY,g:null,z:null}});
  window.addEventListener('pointermove',e=>{
    if(!st)return;
    if(!st.g){if(Math.hypot(e.clientX-st.x,e.clientY-st.y)<7)return;
      const r=st.d.getBoundingClientRect();st.g=st.d.cloneNode(true);st.g.classList.add('ghost');st.g.classList.remove('sel');
      st.g.style.width=r.width+'px';st.ox=st.x-r.left;st.oy=st.y-r.top;document.body.append(st.g);st.d.classList.add('lift');
      if(sel){sel.classList.remove('sel');sel=null}}
    st.g.style.left=e.clientX-st.ox+'px';st.g.style.top=e.clientY-st.oy+'px';
    const z=zoneAt(e.clientX,e.clientY);if(z!==st.z){st.z?.classList.remove('over');z?.classList.add('over');st.z=z}
  });
  const end=e=>{if(!st)return;if(st.g){st.g.remove();st.d.classList.remove('lift');st.z?.classList.remove('over');if(st.z&&st.z!==st.d)onDrop(st.d,st.z,e.clientY);skip=true;setTimeout(()=>skip=false,0)}st=null};
  window.addEventListener('pointerup',end);window.addEventListener('pointercancel',end);
  root.addEventListener('click',e=>{
    if(skip)return;if(e.target.closest('button:not([data-drag])'))return;
    const d=e.target.closest('[data-drag]'),z=e.target.closest('[data-drop]');
    if(d&&!d.hasAttribute('data-drop')){if(sel===d){d.classList.remove('sel');sel=null}else{sel?.classList.remove('sel');sel=d;d.classList.add('sel')}return}
    if(sel&&z&&z!==sel){const s=sel;sel.classList.remove('sel');sel=null;onDrop(s,z,null);return}
    if(d){if(sel===d){d.classList.remove('sel');sel=null}else{sel?.classList.remove('sel');sel=d;d.classList.add('sel')}return}
    if(z&&onTap)onTap(z);
  });
}

const TASKS=[];const status=[];
function shell(i,title,kind,ins){
  const sec=document.createElement('section');sec.className='task';sec.id='t'+(i+1);
  sec.innerHTML=`<p class="meta">Завдання ${i+1} з ${NAMES.length} · ${kind}</p><h2>${title}</h2><p class="ins">${ins}</p><div class="body"></div>
  <div class="bar"><button class="btn pri chkb">Перевірити</button><button class="btn hb">Підказка</button><button class="btn rs">Почати знову</button><button class="btn sol" hidden>Показати правильну відповідь</button></div>
  <div class="hint" hidden></div><div class="fbx"></div>
  <div class="navb"><button class="btn pv">← Попереднє</button><button class="btn nx">Наступне →</button></div>`;
  $('#main').append(sec);
  $('.pv',sec).onclick=()=>go(i-1);$('.nx',sec).onclick=()=>go(i+1);
  if(i===0)$('.pv',sec).style.visibility='hidden';if(i===NAMES.length-1)$('.nx',sec).style.visibility='hidden';
  return sec;
}
function hints(sec,list){let k=0;const b=$('.hb',sec),box=$('.hint',sec);
  const lab=()=>b.textContent=k<list.length?`Підказка ${k+1} з ${list.length}`:'Підказки закінчились';lab();
  b.onclick=()=>{if(k>=list.length)return;box.hidden=false;box.insertAdjacentHTML('beforeend',`<p><b>${k+1}.</b> ${typeof list[k]==='function'?list[k]():list[k]}</p>`);k++;lab()};
  return()=>{k=0;box.innerHTML='';box.hidden=true;lab()};
}
function fb(sec,ok,items=[],head){
  $('.fbx',sec).innerHTML=`<div class="fb ${ok?'ok':'bad'}" role="status"><h3>${head||(ok?pick(PRAISE):pick(TRY))}</h3>${items.length?'<ul>'+items.map(x=>`<li>${x}</li>`).join('')+'</ul>':''}</div>`;
  $('.sol',sec).hidden=ok;setStatus(TASKS.indexOf(sec),ok?'done':'try');
}
function clearFb(sec){$('.fbx',sec).innerHTML='';$('.sol',sec).hidden=true}
function setStatus(i,s){if(status[i]==='done'&&s==='try')return;status[i]=s;renderNav()}
